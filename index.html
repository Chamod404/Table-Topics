<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money, Money, Money! — Table Topics</title>
<style>
:root {
  --site-primary: #173f35;
  --site-on-primary: #ffffff;
  --site-secondary: #d7ad62;
  --site-on-secondary: #18231e;
  --site-background: #f4f1e9;
  --site-on-background: #1e2924;
  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: Georgia, "Times New Roman", serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
.app { min-height: 100vh; width: 100%; background-color: var(--site-background); color: var(--site-on-background); padding: calc(36px * var(--site-spacing-scale)) 22px 48px; }
.wrap { max-width: 900px; margin: 0 auto; }
header { text-align: center; padding: 18px 0 30px; }
.eyebrow { text-transform: uppercase; letter-spacing: .2em; font-size: 11px; font-weight: 800; color: #a47732; }
h1 { font: 700 calc(42px * var(--site-heading-scale))/1.08 var(--site-font-heading); margin: 12px 0 10px; color: var(--site-primary); }
.subtitle { margin: 0; color: #65716b; font-size: 15px; }
.rule { height: 3px; width: 54px; background: var(--site-secondary); margin: 23px auto 0; border-radius: 9px; }
.panel { background: light-dark(#ffffff, #202a26); color: light-dark(#1e2924, #f2f1e9); border: 1px solid light-dark(#e6e0d4, #3b4942); border-radius: calc(22px * var(--site-radius-scale)); padding: 26px; box-shadow: 0 12px 35px rgba(32, 42, 38, .07); }
.instruction { text-align: center; font-size: 13px; color: light-dark(#738078, #b6c1ba); margin: 0 0 19px; }
.buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 11px; }
.qbtn { min-height: 58px; border: 1px solid light-dark(#d9e0da, #45564d); background: light-dark(#f7f8f5, #293630); color: light-dark(#234337, #e9f0eb); border-radius: 13px; font: 700 17px var(--site-font-body); cursor: pointer; transition: transform .15s, background .15s, color .15s; }
.qbtn:hover { transform: translateY(-2px); border-color: var(--site-primary); }
.qbtn.active { background: var(--site-primary); color: var(--site-on-primary); border-color: var(--site-primary); }
.qbtn.used { background: #d3d7d4; color: #4b554f; border-color: #b8c0ba; }
.qbtn.used:hover { border-color: #7b8980; }
.answer { margin-top: 23px; min-height: 210px; border-radius: 17px; padding: 27px; background: light-dark(#f4f1e9, #18221e); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.number { font-size: 11px; letter-spacing: .17em; text-transform: uppercase; font-weight: 800; color: #a47732; margin-bottom: 14px; }
.question { font: 700 clamp(23px, 4vw, 34px)/1.28 var(--site-font-heading); max-width: 700px; color: light-dark(#173f35, #f4f1e9); }
.placeholder { color: light-dark(#87928b, #aab6ae); font-size: 16px; }
.actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.action { border: 0; border-radius: 999px; padding: 12px 20px; background: var(--site-primary); color: var(--site-on-primary); font-weight: 700; cursor: pointer; font-size: 13px; }
.action.secondary { background: transparent; color: light-dark(#345346, #dbe5de); border: 1px solid light-dark(#cbd5cd, #526158); }
footer { text-align: center; margin-top: 24px; color: #89938c; font-size: 11px; letter-spacing: .04em; }
@media (max-width: 560px) {
 .app { padding: 24px 14px 36px; }
 h1 { font-size: calc(34px * var(--site-heading-scale)); }
 .panel { padding: 17px; }
 .buttons { grid-template-columns: repeat(5, 1fr); gap: 7px; }
 .qbtn { min-height: 49px; font-size: 15px; border-radius: 10px; }
 .answer { padding: 22px 16px; min-height: 190px; }
}
</style>
</head>
<body>
<main class="app">
  <div class="wrap">
    <header>
      <div class="eyebrow">Toastmasters · Table Topics</div>
      <h1>Money, Money, Money!</h1>
      <p class="subtitle">A little spending, a little saving, and plenty of financial confessions.</p>
      <div class="rule"></div>
    </header>
    <section class="panel" aria-label="Question picker">
      <p class="instruction">Choose a number to reveal a question</p>
      <div class="buttons" id="buttons"></div>
      <div class="answer" aria-live="polite">
        <div class="placeholder" id="placeholder">Your next question is just one click away…</div>
        <div class="number" id="number" hidden></div>
        <div class="question" id="question"></div>
      </div>
      <div class="actions">
        <button class="action" id="random">Surprise me ↗</button>
        <button class="action secondary" id="next">Next question →</button>
      </div>
    </section>
    <footer>THINK FAST · SPEAK FROM THE HEART · HAVE FUN</footer>
  </div>
</main>
<script>
const questions = [
  "Lottery Winner: What's one thing you'd buy with your lottery winnings that your family would disapprove of?",
  "Money Well Spent? What's the most expensive meal you've ever had, and was it worth it?",
  "The Family CFO: Who in your family would be the biggest threat to your household budget?",
  "Budget Traveller: What's the cheapest holiday you've ever taken, and was it worth it?",
  "The Big Day: Would you choose an expensive wedding or a simple one and spend the savings elsewhere?",
  "Financial Confession: What's the most unnecessary thing you've bought recently? Would you buy it again?",
  "Biggest Financial Mistake: What's one financial decision you wish you could undo?",
  "Retire Tomorrow: If your salary continued but you never had to work again, what would you do?",
  "Salary Negotiation: Would you accept double the salary if it meant double the workload?",
  "Credit Card Confession: What's one credit card purchase you still haven't financially recovered from?"
];
const buttons = document.getElementById("buttons");
const number = document.getElementById("number");
const question = document.getElementById("question");
const placeholder = document.getElementById("placeholder");
let current = -1;
questions.forEach((_, i) => {
  const btn = document.createElement("button");
  btn.className = "qbtn";
  btn.textContent = String(i + 1);
  btn.setAttribute("aria-label", "Show question " + (i + 1));
  btn.setAttribute("aria-pressed", "false");
  btn.addEventListener("click", () => showQuestion(i));
  buttons.appendChild(btn);
});
function showQuestion(i) {
  current = i;
  placeholder.hidden = true;
  number.hidden = false;
  number.textContent = "Question " + (i + 1);
  question.textContent = questions[i];
  [...buttons.children].forEach((btn, index) => {
    btn.classList.toggle("active", index === i);
    if (index === i) btn.classList.add("used");
    btn.setAttribute("aria-pressed", index === i ? "true" : "false");
  });
}
document.getElementById("random").addEventListener("click", () => {
  let i = Math.floor(Math.random() * questions.length);
  if (questions.length > 1 && i === current) i = (i + 1) % questions.length;
  showQuestion(i);
});
document.getElementById("next").addEventListener("click", () => showQuestion((current + 1) % questions.length));
</script>
</body>
</html>
